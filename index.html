<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>楽譜スクロール</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon-192.png">
<script data-goatcounter="https://wel-be.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000;font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
[hidden]{display:none!important}button,input,select{font:inherit;color:#000;background:#fff;border:1.5px solid #000;border-radius:6px;padding:6px 10px}button{cursor:pointer}button.k{background:#000;color:#fff}
#lib{padding:16px max(16px,env(safe-area-inset-left));max-width:720px;margin:auto}h1{font-size:22px;margin:4px 0 12px;letter-spacing:.04em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input[type=search]{flex:1;min-width:120px}
.it{border:1.5px solid #000;border-radius:8px;padding:10px 12px;margin-bottom:8px}.it.cur{border-width:3px}.it b{display:block;font-size:17px}.it small{color:#444}.it .r{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.of{display:block;text-align:center;margin:20px 0;font-size:12px;color:#444}
#ana{padding:40px 20px;text-align:center}#pbar{height:10px;border:1.5px solid #000;border-radius:5px;margin:12px auto;max-width:360px}#pbar i{display:block;height:100%;width:0;background:#000}#pv{max-width:200px;max-height:160px;border:1px solid #ccc;margin-top:8px}
#ply{height:100dvh;display:flex;flex-direction:column}#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none}
#strip{display:flex;align-items:center;height:100%;width:max-content;will-change:transform}#strip canvas{flex:none;display:block}
#hl{position:absolute;top:3%;bottom:3%;background:rgba(0,0,0,.09);border:2px solid #000;pointer-events:none}
#cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;text-align:center;font-size:min(34vh,200px);font-weight:700;line-height:1.2;background:rgba(255,255,255,.72);pointer-events:none}
#bar{display:flex;gap:6px;align-items:center;padding:6px max(8px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom));overflow-x:auto;white-space:nowrap;border-top:1.5px solid #000;font-size:13px}#bar button,#bar input,#bar select{padding:4px 8px}#bar input[type=number]{width:58px}
#end,#rot{position:fixed;inset:0;background:rgba(255,255,255,.95);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9}
</style></head><body>
<div id="lib"><h1>楽譜スクロール</h1><div class="tools"><button class="k" id="add">PDFを追加</button><input type="file" id="file" accept="application/pdf" hidden><input type="search" id="q" placeholder="曲名で検索"><select id="so"><option value="last">最終演奏日順</option><option value="added">登録日順</option><option value="title">曲名の五十音順</option></select></div><div id="list"></div><a class="of" href="https://ofuse.me/f3a8ad6a" target="_blank" rel="noopener">改善のアイディア・応援はこちら</a></div>
<div id="ana" hidden><div id="at">解析中</div><div id="pbar"><i></i></div><div id="an"></div><canvas id="pv"></canvas><p><button id="cx">キャンセル</button></p></div>
<div id="ply" hidden><div id="stage"><div id="strip"></div><div id="hl"></div><div id="cd" hidden></div></div>
<div id="bar"><button id="bk">一覧へ</button><button id="b0">最初へ</button><button id="bp">前</button><button class="k" id="go">再生</button><button id="bn">次</button><span id="pos"></span>BPM<input type="number" id="bpm" min="20" max="300" step="1" inputmode="numeric"><input type="number" id="nu" min="1" max="32" step="1" inputmode="numeric">/<select id="de"><option>2</option><option>4</option><option>8</option><option>16</option></select><button id="ap">全体に適用</button><button id="ch">この小節から</button><button id="rm">解除</button><button id="zm">−</button><button id="zp">＋</button><label><input type="checkbox" id="mt">メトロノーム</label><label><input type="checkbox" id="cs">カウント音</label></div></div>
<div id="end" hidden><p id="em"></p><button class="k" id="er">最初から再生</button><button id="el">一覧に戻る</button></div>
<div id="rot" hidden><p>画面を横向きにしてください</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const db=new Promise((res,rej)=>{const r=indexedDB.open('ss',1);r.onupgradeneeded=()=>{r.result.createObjectStore('scores',{keyPath:'id'});r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const getS=id=>tx('scores','readonly',s=>s.get(id)),allS=()=>tx('scores','readonly',s=>s.getAll()),putS=o=>tx('scores','readwrite',s=>s.put(o)),getF=id=>tx('files','readonly',s=>s.get(id)),putF=o=>tx('files','readwrite',s=>s.put(o));
const delAll=async id=>{await tx('scores','readwrite',s=>s.delete(id));await tx('files','readwrite',s=>s.delete(id))};
const SC=2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let sc,pdf,cancel=false,S=[],M=[],m=0,f=0,cur,st,mode='stop',ms0=0,dur=0,nxt=false,raf=0,txx=0,cd,ctx,srcs=[],wl,failMsg='';
const set=Object.assign({mt:false,cs:false},JSON.parse(localStorage.ss_set||'{}'));$('#mt').checked=set.mt;$('#cs').checked=set.cs;
$('#mt').onchange=$('#cs').onchange=()=>{set.mt=$('#mt').checked;set.cs=$('#cs').checked;localStorage.ss_set=JSON.stringify(set)};
function show(id){['lib','ana','ply'].forEach(x=>$('#'+x).hidden=x!=id);checkRot()}
const fmt=t=>t?new Date(t).toLocaleDateString('ja-JP'):'未演奏';
async function load(){let a=await allS();const q=$('#q').value.trim(),so=$('#so').value;a=a.filter(s=>s.title.includes(q));a.sort((x,y)=>so=='title'?x.title.localeCompare(y.title,'ja'):so=='added'?y.added-x.added:(y.last||0)-(x.last||0));
const top=Math.max(0,...a.map(s=>s.last||0)),L=$('#list');L.textContent='';if(!a.length)L.textContent='「PDFを追加」から楽譜を登録してください。';
for(const s of a){const d=document.createElement('div');d.className='it'+(top&&s.last==top?' cur':'');const b=document.createElement('b');b.textContent=s.title;const sm=document.createElement('small');sm.textContent=`登録 ${fmt(s.added)} ／ 最終演奏 ${fmt(s.last)}`+(top&&s.last==top?' ／ 前回の楽譜':'');const r=document.createElement('div');r.className='r';
const o=document.createElement('button');o.className='k';o.textContent='開く';o.onclick=()=>openScore(s.id);const rn=document.createElement('button');rn.textContent='曲名変更';rn.onclick=async()=>{const t=prompt('曲名',s.title);if(t&&t.trim()){s.title=t.trim();await putS(s);load()}};const dl=document.createElement('button');dl.textContent='削除';dl.onclick=async()=>{if(confirm(`「${s.title}」を削除しますか？`)){await delAll(s.id);load()}};r.append(o,rn,dl);d.append(b,sm,r);L.append(d)}}
$('#q').oninput=$('#so').onchange=load;$('#add').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;const id=crypto.randomUUID();
try{const p=await pdfjsLib.getDocument({data:await fl.arrayBuffer()}).promise;await putF({id,blob:fl});await putS({id,title:fl.name.replace(/\.pdf$/i,''),added:Date.now(),last:0,total:p.numPages,pages:{},bpm:100,num:4,den:4,changes:{},pos:{m:0,f:0},zoom:1,fresh:true});openScore(id)}catch(err){alert('PDFを読み込めません：'+err.message)}};
async function renderPage(n){const p=await pdf.getPage(n),v=p.getViewport({scale:SC}),c=document.createElement('canvas');c.width=v.width|0;c.height=v.height|0;await p.render({canvasContext:c.getContext('2d',{willReadFrequently:true}),viewport:v}).promise;return c}
function analyze(c){const W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,dk=new Uint8Array(W*H);for(let i=0;i<W*H;i++)dk[i]=d[i*4]+d[i*4+1]+d[i*4+2]<420?1:0;
const row=new Int32Array(H);for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++)s+=dk[y*W+x];row[y]=s}
let mx=0;for(const v of row)mx=Math.max(mx,v);if(mx<W*.3)throw new Error('五線譜が見つかりません');
const ls=[];for(let y=0;y<H;){if(row[y]>=mx*.5){const a=y;while(y<H&&row[y]>=mx*.5)y++;ls.push((a+y-1)/2)}else y++}
const gp=[];for(let i=1;i<ls.length;i++)gp.push(ls[i]-ls[i-1]);const g0=[...gp].sort((a,b)=>a-b)[Math.floor(gp.length*.25)]||1,stv=[];let g=[ls[0]];
for(let i=1;i<ls.length;i++){if(ls[i]-ls[i-1]>1.8*g0){stv.push(g);g=[]}g.push(ls[i])}stv.push(g);
if(stv.some(x=>x.length!=5))throw new Error('五線の検出が不完全です');if(stv.length%2)throw new Error('段の数が奇数です（右手・左手の組にできません）');
const sy=[];for(let i=0;i<stv.length;i+=2){const a=stv[i],b=stv[i+1],t1=Math.round(a[0]),b1=Math.round(a[4]),t2=Math.round(b[0]),b2=Math.round(b[4]),gg=(a[4]-a[0])/4,xs=[];
for(let x=0;x<W;x++){let c1=0,c2=0;for(let y=t1;y<=b1;y++)c1+=dk[y*W+x];for(let y=t2;y<=b2;y++)c2+=dk[y*W+x];if(c1>=.95*(b1-t1+1)&&c2>=.95*(b2-t2+1))xs.push(x)}
const cl=[];for(const x of xs){const l=cl[cl.length-1];if(l&&x-l[l.length-1]<=.8*gg)l.push(x);else cl.push([x])}
let bars=[];for(const q of cl){const x=q.reduce((p,v)=>p+v,0)/q.length;if(!bars.length||x-bars[bars.length-1]>=4*gg)bars.push(x)}
if(bars.length<2)throw new Error('小節線が見つかりません');
sy.push({y0:Math.max(0,Math.round(t1-4*gg)),y1:Math.min(H,Math.round(b2+5*gg)),x0:Math.round(bars[0]),x1:Math.round(bars[bars.length-1]),g:gg,bars:bars.map(x=>x-Math.round(bars[0]))})}
return sy}
async function runAnalysis(){sc.total=pdf.numPages;const ok=()=>Object.keys(sc.pages).length;
for(let n=1;n<=sc.total;n++){if(sc.pages[n])continue;if(cancel)break;$('#at').textContent='楽譜を解析中';$('#an').textContent=`${ok()} / ${sc.total} ページ`;
try{const c=await renderPage(n);sc.pages[n]={ok:true,systems:analyze(c)};const pv=$('#pv');pv.width=c.width/4;pv.height=c.height/4;pv.getContext('2d').drawImage(c,0,0,pv.width,pv.height)}catch(e){sc.pages[n]={ok:false,err:e.message}}
$('#pbar i').style.width=Math.round(ok()/sc.total*100)+'%';$('#an').textContent=`${ok()} / ${sc.total} ページ（${Math.round(ok()/sc.total*100)}％）`;await putS(sc)}}
$('#cx').onclick=()=>{cancel=true};
async function openScore(id){sc=await getS(id);cancel=false;$('#pbar i').style.width='0';show('ana');
try{pdf=await pdfjsLib.getDocument({data:await (await getF(id)).blob.arrayBuffer()}).promise}catch(e){alert('PDFを開けません：'+e.message);show('lib');return}
await runAnalysis();if(cancel){show('lib');load();return}await buildPlayer()}
async function buildPlayer(){S=[];let bad=0;$('#at').textContent='楽譜を読み込み中';
for(let n=1;n<=sc.total;n++){const p=sc.pages[n];if(!p||!p.ok){bad=n;break}const pc=await renderPage(n);$('#an').textContent=`${n} / ${sc.total} ページ`;
for(const s of p.systems){const cv=document.createElement('canvas');cv.width=s.x1-s.x0;cv.height=s.y1-s.y0;cv.getContext('2d').drawImage(pc,s.x0,s.y0,cv.width,cv.height,0,0,cv.width,cv.height);S.push({cv,g:s.g,bars:s.bars,w:cv.width,h:cv.height})}}
failMsg=bad?`ページ${bad}の解析に失敗したため、その手前で停止します（${sc.pages[bad]?sc.pages[bad].err:'未解析'}）。`:'';
if(!S.length){alert('演奏できるページがありません。'+failMsg);show('lib');load();return}
if(failMsg)alert(failMsg);show('ply');layout();
if(!sc.fresh&&(sc.pos.m||sc.pos.f)&&confirm('続きから再開しますか？\n（キャンセルで最初から）')){m=clamp(sc.pos.m,0,M.length-1);f=sc.pos.f}else{m=0;f=0}
mode='stop';cur=stateAt(m);ui();place()}
function layout(){const H=$('#stage').clientHeight-8,mr=Math.max(...S.map(s=>s.h/s.g)),k=H/mr*sc.zoom,strip=$('#strip');strip.textContent='';M=[];let X=0;
for(const s of S){const q=k/s.g;s.cv.style.width=s.w*q+'px';s.cv.style.height=s.h*q+'px';strip.append(s.cv);for(let j=0;j<s.bars.length-1;j++)M.push({l:X+s.bars[j]*q,w:(s.bars[j+1]-s.bars[j])*q});X+=s.w*q}m=clamp(m,0,M.length-1)}
function place(){const a=M[m];txx=$('#stage').clientWidth*.4-(a.l+f*a.w);$('#strip').style.transform=`translateX(${txx}px)`;const h=$('#hl');h.hidden=mode!='stop';h.style.left=a.l+txx+'px';h.style.width=a.w+'px'}
const stateAt=i=>{const s={bpm:sc.bpm,num:sc.num,den:sc.den};for(let j=0;j<=i;j++)if(sc.changes[j])Object.assign(s,sc.changes[j]);return s},mdur=s=>s.num*4/s.den*60/s.bpm;
function ui(){$('#bpm').value=cur.bpm;$('#nu').value=cur.num;$('#de').value=cur.den;$('#pos').textContent=`${m+1}/${M.length}小節${sc.changes[m]?'（変更あり）':''}`;$('#bar').hidden=mode!='stop'}
function save(){sc.pos={m,f};sc.last=Date.now();sc.fresh=false;putS(sc)}
function inp(){const b=+$('#bpm').value,n=+$('#nu').value,d=+$('#de').value;if(!Number.isInteger(b)||b<20||b>300||!Number.isInteger(n)||n<1||n>32){alert('BPMは20〜300の整数、拍子の分子は1〜32の整数で入力してください');return null}return{bpm:b,num:n,den:d}}
$('#ap').onclick=()=>{const v=inp();if(v){Object.assign(sc,v);cur=stateAt(m);ui();save()}};$('#ch').onclick=()=>{const v=inp();if(v){sc.changes[m]=v;cur=stateAt(m);ui();save()}};$('#rm').onclick=()=>{delete sc.changes[m];cur=stateAt(m);ui();save()};
const zoom=d=>{sc.zoom=clamp(Math.round((sc.zoom+d)*10)/10,.5,2.5);layout();place();save()};$('#zm').onclick=()=>zoom(-.1);$('#zp').onclick=()=>zoom(.1);
const mv=i=>{m=clamp(i,0,M.length-1);f=0;cur=stateAt(m);ui();place()};$('#bp').onclick=()=>mv(m-1);$('#bn').onclick=()=>mv(m+1);$('#b0').onclick=()=>mv(0);
function click(t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.9:.5,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.06);srcs.push(o);o.onended=()=>{srcs=srcs.filter(x=>x!=o)}}
const stopClicks=()=>{srcs.forEach(o=>{try{o.stop()}catch(e){}});srcs=[]};
function beats(T,s){const bd=4/s.den*60/s.bpm;for(let k=0;k<s.num;k++)if(T+k*bd>=ctx.currentTime-.005)click(T+k*bd,k==0)}
function lock(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}}const unlock=()=>{try{wl&&wl.release()}catch(e){}wl=null};
async function go(){if(mode!='stop')return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();const s=f>0?cur:stateAt(m-1);cd={t0:ctx.currentTime+.05,bd:4/s.den*60/s.bpm,n:s.num};
if(set.mt||set.cs)for(let k=0;k<s.num;k++)click(cd.t0+k*cd.bd,k==0);mode='cd';$('#cd').hidden=false;$('#bar').hidden=true;$('#hl').hidden=true;lock();loop()}
function startPlay(){$('#cd').hidden=true;mode='play';st={...cur};Object.assign(st,sc.changes[m]);dur=mdur(st);ms0=ctx.currentTime-f*dur;nxt=false;if(set.mt)beats(ms0,st)}
function loop(){if(mode=='stop')return;const now=ctx.currentTime;
if(mode=='cd'){const n=Math.floor((now-cd.t0)/cd.bd);if(n>=cd.n)startPlay();else $('#cd').textContent=Math.max(1,n+1)}
if(mode=='play'){if(!nxt&&m<M.length-1&&now>ms0+dur-.15){nxt=true;if(set.mt)beats(ms0+dur,{...st,...sc.changes[m+1]})}
if(now>=ms0+dur){if(m>=M.length-1){finish();return}ms0+=dur;m++;Object.assign(st,sc.changes[m]);dur=mdur(st);nxt=false}f=clamp((now-ms0)/dur,0,1);place()}
raf=requestAnimationFrame(loop)}
function halt(){cancelAnimationFrame(raf);stopClicks();unlock();$('#cd').hidden=true}
function pause(){if(mode=='play')cur={...st};halt();mode='stop';save();ui();place()}
function cancelCd(){halt();mode='stop';ui();place()}
function finish(){halt();mode='stop';m=M.length-1;f=1;save();ui();place();$('#em').textContent=failMsg||'最後の小節まで演奏しました。';$('#end').hidden=false}
$('#go').onclick=go;$('#er').onclick=()=>{$('#end').hidden=true;mv(0);go()};$('#el').onclick=$('#bk').onclick=()=>{if(mode!='stop')halt();mode='stop';if(sc&&M.length)save();$('#end').hidden=true;show('lib');load()};
const ctr=e=>{const r=$('#stage').getBoundingClientRect();return Math.abs(e.clientX-r.left-r.width/2)<r.width*.15&&Math.abs(e.clientY-r.top-r.height/2)<r.height*.3};
let p0=null;const sg=$('#stage');sg.onpointerdown=e=>{p0={x:e.clientX,y:e.clientY}};
sg.onpointerup=e=>{if(!p0)return;const dx=e.clientX-p0.x,dy=e.clientY-p0.y;p0=null;
if(mode=='cd'){if(ctr(e)&&Math.abs(dx)<10)cancelCd();return}
if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){const t=clamp(m+(dx<0?1:-1)*Math.min(32,Math.ceil(Math.abs(dx)/60)),0,M.length-1);
if(mode=='play'){stopClicks();m=t;f=0;Object.assign(st,sc.changes[t]);dur=mdur(st);ms0=ctx.currentTime;nxt=false;if(set.mt)beats(ms0,st);place()}else mv(t)}
else if(Math.abs(dx)<10&&Math.abs(dy)<10){if(mode=='play'){if(ctr(e))pause()}else if(mode=='stop'){const x=e.clientX-sg.getBoundingClientRect().left-txx,i=M.findIndex(a=>x>=a.l&&x<a.l+a.w);if(i>=0)mv(i)}}};
function checkRot(){const p=innerHeight>innerWidth&&!$('#ply').hidden;$('#rot').hidden=!p;if(p&&mode=='play')pause();if(p&&mode=='cd')cancelCd()}
addEventListener('resize',()=>{checkRot();if(!$('#ply').hidden&&M.length&&innerWidth>innerHeight){layout();place()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode=='play')pause();else if(mode=='cd')cancelCd()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script></body></html>
